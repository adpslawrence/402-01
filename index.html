<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰雪賽貓手 - Ice Race Cat</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #00ffff;
            background-color: #080a0f;
        }

        #gameCanvas {
            background: linear-gradient(180deg, #1e3a8a 0%, #3b82f6 40%, #bfdbfe 100%);
            display: block;
            touch-action: none;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            z-index: 10;
            border-radius: 8px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .start-button, .restart-button {
            padding: 0.75rem 2rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #0d1117;
            background: #00ffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px #00ffff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px #00ffff; }
            50% { box-shadow: 0 0 30px #00ffff, 0 0 5px #00ffff; }
            100% { box-shadow: 0 0 15px #00ffff; }
        }

        @media (max-width: 640px) {
            #gameCanvas {
                width: 100vw;
                height: calc(100vw * 1.5);
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="w-full max-w-lg mx-auto">
        <canvas id="gameCanvas"></canvas>

        <!-- UI 介面 -->
        <div id="uiOverlay" class="ui-overlay">
            <h1 class="text-4xl font-extrabold mb-4 text-white drop-shadow-lg">冰雪賽貓手</h1>
            <div class="text-left text-sm mb-6 space-y-1 text-gray-300">
                <p>💎 寶石: 分數+10</p>
                <p>❤️ 愛心: 補血</p>
                <p>⚡ 閃電: 狂飆無敵</p>
                <p>🧲 磁鐵: 自動吸取寶石</p>
                <p>❄️ 雪球: 對手減速</p>
                <p>⭐ 幸運星: 分數+50</p>
            </div>
            <button id="startButton" class="start-button">開始遊戲</button>
            <div id="gameOverMessage" class="hidden mt-4 text-2xl font-bold text-red-500">遊戲結束！</div>
            <button id="restartButton" class="restart-button hidden mt-6">重新開始</button>
        </div>

        <!-- 頂部資訊列 -->
        <div class="absolute top-0 left-0 right-0 p-4 flex justify-between text-white font-bold text-xl drop-shadow-lg z-20 pointer-events-none">
            <div>分數: <span id="scoreDisplay">0</span></div>
            <div id="healthContainer">生命: <span id="healthDisplay">❤️❤️❤️</span></div>
        </div>
        
        <!-- 狀態計時器 -->
        <div id="statusAlert" class="absolute top-16 left-1/2 -translate-x-1/2 px-4 py-2 bg-yellow-600 text-white font-bold rounded-full shadow-xl hidden z-20 transition-all duration-300">
             <span id="statusEmoji">⚡</span> <span id="statusText">狀態</span>: <span id="timerValue">3.0</span>s
        </div>

        <!-- 魔王血條 -->
        <div id="bossHealthBar" class="absolute top-4 left-1/2 -translate-x-1/2 w-3/4 max-w-xs h-6 bg-red-800 border-2 border-red-400 rounded-full overflow-hidden hidden z-20">
            <div id="bossHealthFill" class="h-full bg-red-500 transition-all duration-100"></div>
            <div class="absolute inset-0 text-white text-sm font-bold flex justify-center items-center">魔王生命值</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiOverlay = document.getElementById('uiOverlay');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');
        const gameOverMessage = document.getElementById('gameOverMessage');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const healthDisplay = document.getElementById('healthDisplay');
        const bossHealthBar = document.getElementById('bossHealthBar');
        const bossHealthFill = document.getElementById('bossHealthFill');
        const statusAlert = document.getElementById('statusAlert');
        const statusEmoji = document.getElementById('statusEmoji');
        const statusText = document.getElementById('statusText');
        const timerValue = document.getElementById('timerValue');

        const playerMoveSpeed = 7;
        let game = {
            isRunning: false,
            score: 0,
            health: 3,
            maxHealth: 5,
            lastSpawnTime: 0,
            spawnInterval: 500,
            gameSpeed: 5,
            playerSpeedFactor: 1,
            level: 1,
            playerIsInvincible: false, // 閃電無敵
            isHurtInvincible: false,   // 受傷無敵
            hasMagnet: false,          // 磁鐵狀態
            isSnowing: false,          // 雪球狀態（敵方減速）
            originalGameSpeed: 5,
            isBossTime: false,
            boss: null,
            bullets: [],
            bossScoreThreshold: 500,
        };

        let keys = { ArrowLeft: false, ArrowRight: false, KeyA: false, KeyD: false };

        let player = {
            x: 0,
            y: 0,
            width: 60,
            height: 80,
            emoji: '🏎️',
            catEmoji: '😺',
        };

        class GameItem {
            constructor(type, x) {
                this.type = type;
                this.x = x;
                this.y = -20;
                this.size = 30;
                this.isBeingMagnetized = false;

                switch(type) {
                    case 'gem': this.emoji = '💎'; this.color = '#00ffff'; break;
                    case 'health': this.emoji = '❤️'; this.color = '#f87171'; break;
                    case 'speed': this.emoji = '⚡'; this.color = '#ffcc00'; break;
                    case 'magnet': this.emoji = '🧲'; this.color = '#94a3b8'; break;
                    case 'snowball': this.emoji = '❄️'; this.color = '#ffffff'; break;
                    case 'star': this.emoji = '⭐'; this.color = '#fde047'; break;
                }
            }
            draw() {
                ctx.save();
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.font = `${this.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(this.emoji, this.x, this.y);
                ctx.restore();
            }
            update() {
                // 磁鐵邏輯
                if (game.hasMagnet && this.type === 'gem') {
                    const dx = player.x - this.x;
                    const dy = (player.y + player.height/2) - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 250) {
                        this.isBeingMagnetized = true;
                        this.x += dx * 0.1;
                        this.y += dy * 0.1;
                        return;
                    }
                }
                this.y += game.gameSpeed * game.playerSpeedFactor;
            }
        }

        class Rival {
            constructor(x) {
                this.x = x;
                this.y = -80;
                this.width = 60;
                this.height = 80;
                this.emoji = '🚗';
                this.color = '#ff00ff';
            }
            draw() {
                ctx.save();
                ctx.shadowColor = game.isSnowing ? '#93c5fd' : this.color;
                ctx.shadowBlur = 10;
                if (game.isSnowing) ctx.globalAlpha = 0.7;
                ctx.font = `${this.height * 0.7}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(this.emoji, this.x, this.y + this.height * 0.7);
                ctx.restore();
            }
            update() {
                // 雪球減速邏輯
                const speedMult = game.isSnowing ? 0.3 : 1;
                this.y += game.gameSpeed * game.playerSpeedFactor * speedMult;
                this.x += Math.sin(this.y * 0.02) * 1.5;
                this.x = Math.max(this.width / 2, Math.min(canvas.width - this.width / 2, this.x));
            }
        }

        class PlayerBullet {
            constructor(x) {
                this.x = x; this.y = player.y; this.size = 15; this.speed = 10; this.emoji = '🔥';
            }
            draw() {
                ctx.save(); ctx.font = `${this.size}px sans-serif`; ctx.textAlign = 'center';
                ctx.fillText(this.emoji, this.x, this.y); ctx.restore();
            }
            update() { this.y -= this.speed; }
        }

        class Boss {
            constructor() {
                this.maxHealth = 20; this.health = this.maxHealth;
                this.width = 150; this.height = 100; this.x = canvas.width / 2; this.y = -this.height;
                this.emoji = '👾'; this.speed = 3; this.moveDir = 1;
            }
            draw() {
                ctx.save(); ctx.font = `${this.height * 0.8}px sans-serif`; ctx.textAlign = 'center';
                ctx.fillText(this.emoji, this.x, this.y + this.height * 0.7); ctx.restore();
            }
            update() {
                if (this.y < 50) this.y += 2;
                else {
                    this.x += this.speed * this.moveDir;
                    if (this.x > canvas.width - this.width / 2 || this.x < this.width / 2) this.moveDir *= -1;
                }
            }
            checkBulletCollision(bullet) {
                return (bullet.x > this.x - this.width/2 && bullet.x < this.x + this.width/2 &&
                        bullet.y > this.y && bullet.y < this.y + this.height);
            }
        }

        let items = [];
        let rivals = [];
        let animationFrameId;

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = Math.min(window.innerHeight - 50, container.clientWidth * 1.5);
            player.x = canvas.width / 2;
            player.y = canvas.height - player.height - 20;
        }

        function showStatus(emoji, text, duration) {
            statusAlert.classList.remove('hidden');
            statusEmoji.textContent = emoji;
            statusText.textContent = text;
            let timeLeft = duration / 1000;
            timerValue.textContent = timeLeft.toFixed(1);
            
            const timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    statusAlert.classList.add('hidden');
                } else {
                    timerValue.textContent = timeLeft.toFixed(1);
                }
            }, 100);
        }

        function activateSpeedBoost() {
            if (game.playerIsInvincible) return;
            game.originalGameSpeed = game.gameSpeed;
            game.gameSpeed *= 1.8;
            game.playerIsInvincible = true;
            player.catEmoji = '🔥';
            showStatus('⚡', '狂飆', 3000);
            setTimeout(() => {
                game.gameSpeed = game.originalGameSpeed;
                game.playerIsInvincible = false;
                player.catEmoji = '😺';
            }, 3000);
        }

        function activateMagnet() {
            game.hasMagnet = true;
            showStatus('🧲', '吸鐵', 5000);
            setTimeout(() => { game.hasMagnet = false; }, 5000);
        }

        function activateSnowball() {
            game.isSnowing = true;
            showStatus('❄️', '結冰', 4000);
            setTimeout(() => { game.isSnowing = false; }, 4000);
        }

        function handleItemCollision(item) {
            switch(item.type) {
                case 'gem': game.score += 10; break;
                case 'health': game.health = Math.min(game.maxHealth, game.health + 1); break;
                case 'speed': activateSpeedBoost(); break;
                case 'magnet': activateMagnet(); break;
                case 'snowball': activateSnowball(); break;
                case 'star': game.score += 50; break;
            }
            updateUI();
        }

        function handleRivalCollision(rival) {
            if (game.playerIsInvincible) {
                rival.y = canvas.height + 100;
                game.score += 50;
                return;
            }
            if (game.isHurtInvincible) return;

            game.health -= 1;
            game.isHurtInvincible = true;
            game.playerSpeedFactor = 0.5;
            canvas.style.transform = 'translate(5px, 5px)';
            setTimeout(() => canvas.style.transform = 'translate(0, 0)', 100);
            updateUI();
            setTimeout(() => { game.playerSpeedFactor = 1; }, 1000);
            setTimeout(() => { game.isHurtInvincible = false; }, 2000);
            if (game.health <= 0) gameOver();
        }

        function update(currentTime) {
            if (!game.isRunning) return;

            if (keys.ArrowLeft || keys.KeyA) player.x -= playerMoveSpeed * game.playerSpeedFactor;
            if (keys.ArrowRight || keys.KeyD) player.x += playerMoveSpeed * game.playerSpeedFactor;
            player.x = Math.max(player.width/2, Math.min(canvas.width - player.width/2, player.x));

            if (game.score >= game.bossScoreThreshold && !game.isBossTime) {
                game.isBossTime = true;
                items = []; rivals = [];
                game.boss = new Boss();
                bossHealthBar.classList.remove('hidden');
                updateUI();
            }

            if (!game.isBossTime) {
                if (currentTime - game.lastSpawnTime > game.spawnInterval / (game.gameSpeed / 5)) {
                    const types = ['gem','gem','gem','health','speed','magnet','snowball','star'];
                    const type = types[Math.floor(Math.random()*types.length)];
                    items.push(new GameItem(type, Math.random()*(canvas.width-40)+20));
                    if (Math.random() < 0.05 + game.level*0.02) rivals.push(new Rival(Math.random()*(canvas.width-60)+30));
                    game.lastSpawnTime = currentTime;
                }

                items = items.filter(item => {
                    item.update();
                    if (checkPlayerCollision(item)) { handleItemCollision(item); return false; }
                    return item.y < canvas.height + 50;
                });

                rivals = rivals.filter(rival => {
                    rival.update();
                    if (checkPlayerCollision(rival)) { handleRivalCollision(rival); }
                    return rival.y < canvas.height + 100;
                });

                if (game.score >= game.level * 100) {
                    game.level++;
                    if (!game.playerIsInvincible) game.gameSpeed += 0.5;
                    game.spawnInterval = Math.max(200, game.spawnInterval - 50);
                }
            } else {
                game.boss.update();
                game.bullets = game.bullets.filter(b => {
                    b.update();
                    if (game.boss.checkBulletCollision(b)) {
                        game.boss.health--;
                        updateUI();
                        if (game.boss.health <= 0) gameWin();
                        return false;
                    }
                    return b.y > -20;
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 繪製背景線
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            const lineSpeed = Date.now() * 0.01 * game.gameSpeed * game.playerSpeedFactor;
            for (let i = 0; i < canvas.height / 50; i++) {
                const lineY = (i * 50 + lineSpeed) % (canvas.height + 50);
                ctx.fillRect(5, lineY, 5, 20);
                ctx.fillRect(canvas.width - 10, lineY, 5, 20);
            }
            items.forEach(i => i.draw());
            rivals.forEach(r => r.draw());
            if (game.isBossTime && game.boss) {
                game.boss.draw();
                game.bullets.forEach(b => b.draw());
            }
            // 繪製玩家
            ctx.save();
            if (game.isHurtInvincible && Math.floor(Date.now() / 100) % 2 === 0) ctx.globalAlpha = 0.5;
            ctx.shadowColor = game.playerIsInvincible ? 'red' : 'yellow';
            ctx.shadowBlur = 15;
            ctx.font = `${player.height * 0.7}px sans-serif`; ctx.textAlign = 'center';
            ctx.fillText(player.emoji, player.x, player.y + player.height * 0.7);
            ctx.font = `${player.height * 0.3}px sans-serif`;
            ctx.fillText(player.catEmoji, player.x, player.y + player.height * 0.2);
            ctx.restore();
        }

        function checkPlayerCollision(other) {
            const playerCenterX = player.x;
            const playerCenterY = player.y + player.height * 0.7;
            const playerRadius = player.width / 3;
            const otherCenterX = other.x;
            const otherCenterY = other.y + (other.size || other.height) / 2;
            const otherRadius = (other.size || other.width) / 3;
            const dx = playerCenterX - otherCenterX;
            const dy = playerCenterY - otherCenterY;
            return Math.sqrt(dx * dx + dy * dy) < playerRadius + otherRadius;
        }

        function updateUI() {
            scoreDisplay.textContent = game.score;
            healthDisplay.textContent = '❤️'.repeat(Math.max(0, game.health));
            if (game.isBossTime && game.boss) {
                bossHealthFill.style.width = `${(game.boss.health / game.boss.maxHealth) * 100}%`;
            }
        }

        function gameLoop(time) {
            update(time);
            draw();
            if (game.isRunning) animationFrameId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            game = { ...game, isRunning: true, score: 0, health: 3, gameSpeed: 5, playerSpeedFactor: 1, level: 1, isBossTime: false, bullets: [], isHurtInvincible: false, playerIsInvincible: false, hasMagnet: false, isSnowing: false };
            items = []; rivals = [];
            uiOverlay.classList.add('hidden');
            bossHealthBar.classList.add('hidden');
            statusAlert.classList.add('hidden');
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            game.isRunning = false;
            uiOverlay.classList.remove('hidden');
            gameOverMessage.classList.remove('hidden');
            restartButton.classList.remove('hidden');
            startButton.classList.add('hidden');
            gameOverMessage.innerHTML = `遊戲結束！<br>最終分數: ${game.score}`;
        }

        function gameWin() {
            game.isRunning = false;
            uiOverlay.classList.remove('hidden');
            gameOverMessage.classList.remove('hidden');
            restartButton.classList.remove('hidden');
            startButton.classList.add('hidden');
            gameOverMessage.innerHTML = `恭喜勝利！擊敗魔王！<br>分數: ${game.score}`;
        }

        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);
        window.addEventListener('load', () => { resizeCanvas(); updateUI(); });
        window.addEventListener('resize', resizeCanvas);
        document.addEventListener('keydown', (e) => {
            if (!game.isRunning) return;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = true;
            if (e.code === 'Space' && game.isBossTime) {
                e.preventDefault();
                if (game.bullets.length < 5) game.bullets.push(new PlayerBullet(player.x));
            }
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = false;
        });
    </script>
</body>
</html>
